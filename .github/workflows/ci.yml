name: CI

on:
  push:
    branches: [main]
    # Only run on code changes, not on the bot's data refreshes.
    paths:
      - "src/**"
      - "tests/**"
      - "run.py"
      - "tools/**"
      - "requirements*.txt"
      # The lint config lives in pyproject.toml; watching a ruff.toml that
      # doesn't exist meant config changes never triggered CI.
      - "pyproject.toml"
      # Every workflow, not just this one: retry.yml shipped a gate that
      # never fired and CI had no opinion because it wasn't watching.
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:      # so a webhook-dropped commit can be checked by hand

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests tools run.py
      - name: Tests (pytest)
        run: python -m pytest -q
