name: Update internships

on:
  schedule:
    # Minutes 7 and 37, not 0 and 30. GitHub queues scheduled workflows
    # globally and the top of the hour is the busiest slot on the platform —
    # measured Aug 3-5, only 32 of 144 expected runs actually fired, averaging
    # 138 minutes apart. Off-peak minutes get dropped less often.
    - cron: "7,37 * * * *"  # every 30 min (UTC) — peak-season cadence
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the bot can commit the refreshed data
  actions: read               # verify Pages deployed before sending alerts

concurrency:
  group: intern-engine-writer
  cancel-in-progress: false

jobs:
  update:
    # Pinned for REPRODUCIBILITY, not as an outage fix: `ubuntu-latest` already
    # resolves to 24.04 today, so this is the same pool — it just stops the
    # image moving under us when GitHub advances the alias. The 2026-08-06
    # runner-allocation failures (zero steps, blank runner_name, "not acquired
    # by a Runner of type hosted") were a platform incident that no repo-side
    # setting prevents; recovery is handled by retry.yml instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Refresh queued checkout
        run: |
          git fetch --no-tags origin main
          git checkout --detach origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the engine
        env:
          # Optional: WORKDAY_PROXY lets the cloud runner reach Workday tenants
          # that block datacenter IPs. Unset = Workday runs direct.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          # Optional: set these repo secrets to mirror each run into Postgres.
          # Unset = the engine still runs and exports README/CSV as normal.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py update

      # The gate between "we produced output" and "the world sees it". Checks
      # every open role against the accuracy invariants AND the run as a whole
      # (volume floor, fetch collapse). If this fails the job stops here with
      # the previous good build still live on Pages.
      - name: Verify accuracy before publishing
        env:
          MIN_OPEN_ROLES: "70"
          MAX_STATS_AGE_HOURS: "2"
        run: python tools/verify_accuracy.py

      # Alerts are sent by a LATER step, on purpose: an alert promises the role
      # is on the list, so nothing goes out until this push actually lands.
      - name: Commit & push if changed
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/internships.csv data/stats.json \
                  data/health.json data/history.jsonl data/mail_state.json \
                  data/observed.json data/known_windows.json data/outbox.json \
                  docs/index.html docs/feed.xml docs/unsubscribe.html \
                  docs/confirm.html \
                  docs/internships.csv \
                  docs/radar.ics docs/trends-light.svg docs/trends-dark.svg \
                  docs/api/jobs.json docs/api/stats.json docs/api/radar.json
          if git diff --staged --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main changed after generation; refusing to rebase stale artifacts"
            exit 1
          fi
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A git push is not yet a public dashboard. During the Aug 6 incident,
      # update #369 pushed successfully while its Pages deploy timed out. Wait
      # for the exact commit's system Pages run before making any alert promise.
      - name: Wait for Pages to publish this commit
        if: steps.publish.outputs.pushed == 'true'
        timeout-minutes: 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 72); do
            row="$(gh api "repos/$REPO/actions/runs?head_sha=$PUBLISHED_SHA&per_page=100" --jq '
              [.workflow_runs[] | select((.name | ascii_downcase) == "pages build and deployment")]
              | sort_by(.created_at) | last // {}
              | [(.id // ""), (.status // ""), (.conclusion // "")] | @tsv
            ')"
            IFS=$'\t' read -r run_id status conclusion <<< "$row"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "Pages published $PUBLISHED_SHA in run $run_id."
              exit 0
            fi
            if [ "$status" = "completed" ]; then
              echo "::error::Pages run $run_id concluded $conclusion; alerts remain queued"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Pages did not publish $PUBLISHED_SHA within 12 minutes; alerts remain queued"
          exit 1

      - name: Send alerts for what was published
        env:
          # Optional: Discord channel webhook — posts each run's new roles.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: Telegram bot push — instant phone notification per drop.
          # Make a bot with @BotFather, then set both secrets (see telegram.py).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: Brevo transactional key + verified sender — arms the
          # daily email digest to the subscriber list (see mailer.py).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py notify

      # The alert state the previous step just advanced (which roles have been
      # announced, where the send cursor is) has to persist, or the next run
      # re-announces everything.
      - name: Commit alert state
        run: |
          git add data/mail_state.json data/outbox.json
          if git diff --staged --quiet; then
            echo "No alert state change."
            exit 0
          fi
          ALERT_BASE="$(git rev-parse HEAD)"
          git commit -m "chore: alert state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Pages waiting and provider calls create a legitimate window for an
          # unrelated direct main push. Rebase this ledger-only commit when â€”
          # and only when â€” the remote ledgers themselves are unchanged. That
          # preserves successful delivery settlement instead of replaying it
          # next run, without ever overwriting another notifier's state.
          for _attempt in 1 2 3; do
            git fetch --no-tags origin main
            REMOTE="$(git rev-parse origin/main)"
            if ! git diff --quiet "$ALERT_BASE" "$REMOTE" -- \
                    data/mail_state.json data/outbox.json; then
              echo "::error::alert ledgers changed remotely; refusing an unsafe merge"
              exit 1
            fi
            PARENT="$(git rev-parse HEAD^)"
            if [ "$PARENT" != "$REMOTE" ]; then
              git rebase --onto "$REMOTE" "$PARENT"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main advanced during ledger push; retrying safely"
          done
          echo "::error::could not persist alert state after three safe retries"
          exit 1
